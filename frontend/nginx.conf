server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets and SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to routing engine
    location /routing/ {
        proxy_pass http://routing-engine:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to audit service
    location /audit/ {
        proxy_pass http://audit-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
